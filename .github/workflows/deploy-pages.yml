name: deploy sched
on:
  push:
  workflow_dispatch:
  workflow_run:
    workflows: [update schedule]
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build public configuration
        env:
          SHARED_SWAPS_URL: ${{ vars.SHARED_SWAPS_URL || secrets.SHARED_SWAPS_URL }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY || secrets.FIREBASE_API_KEY }}
          TELEGRAM_BOT_NAME: ${{ vars.TELEGRAM_BOT_NAME || secrets.TELEGRAM_BOT_NAME }}
          TELEGRAM_OWNER_ID: ${{ vars.TELEGRAM_OWNER_ID || secrets.TELEGRAM_OWNER_ID }}
          TELEGRAM_ADMIN_IDS: ${{ vars.TELEGRAM_ADMIN_IDS || secrets.TELEGRAM_ADMIN_IDS }}
          SCHED_NOTIFY_URL: ${{ vars.SCHED_NOTIFY_URL }}
        run: python3 scripts/build_config.py
      - name: Stage only public files
        run: python3 scripts/stage_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Notify bot after successful publication
        env:
          SCHED_NOTIFY_URL: ${{ vars.SCHED_NOTIFY_URL }}
          NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
        run: python3 scripts/notify_schedule.py
