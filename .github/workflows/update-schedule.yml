name: update schedule
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-schedule
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install -r scripts/requirements.txt
      - run: python3 scripts/update_schedule.py
      - name: Commit schedule changes
        run: |
          if [ -n "$(git status --porcelain public/data/)" ]; then
            git config user.name "schedule-bot"
            git config user.email "schedule-bot@users.noreply.github.com"
            git add public/data/
            git commit -m "chore: refresh schedule"
            for i in 1 2 3; do
              git pull --rebase origin "${{ github.ref_name }}" || { git rebase --abort; exit 1; }
              git push && exit 0
            done
            exit 1
          fi
