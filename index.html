    <script>
      /* Тема применяется до первой отрисовки, чтобы лоадер не вспыхивал белым. */
      (function () {
        var mix = function (hex, base, ratio) {
          var a = String(hex).replace("#", "");
          var b = String(base).replace("#", "");
          var p = function (i) {
            var x = parseInt(a.slice(i, i + 2), 16);
            var y = parseInt(b.slice(i, i + 2), 16);
            return Math.round(x * ratio + y * (1 - ratio)).toString(16).padStart(2, "0");
          };
          return "#" + p(0) + p(2) + p(4);
        };
        try {
          var raw = localStorage.getItem("weekly:groups:v2");
          var data = raw ? JSON.parse(raw) : {};
          /* Тема: выбранная вручную, иначе — системная (первый запуск подхватывает ОС). */
          var manual =
            data.themeManual === true ||
            (!("themeManual" in data) && (data.theme === "light" || data.theme === "dark"));
          var theme = manual
            ? data.theme
            : window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
          var root = document.documentElement;
          root.dataset.theme = theme;
          var accent =
            typeof data.accent === "string" && /^#[0-9a-f]{6}$/i.test(data.accent) ? data.accent : "";
          var tint = theme === "light" ? "#F5F5F7" : "#000000";
          if ((data.palette === "accent" || data.palette === "accent-plus") && accent) {
            root.dataset.weeklyPalette = data.palette;
            root.style.setProperty("--weekly-accent", accent);
            tint = mix(accent, theme === "light" ? "#ffffff" : "#05050a", theme === "light" ? 0.2 : 0.18);
          }
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", tint);
        } catch (e) {
          /* приватный режим — остаются дефолты из CSS */
        }
      })();
    </script>

    <script>
      /* Страховка от «бесконечной загрузки»: если модуль не поднялся (битый файл
         в кэше service worker, обрыв сети), один раз чистим кэш и перезагружаемся. */
      (function () {
        var FLAG = "weeqo:self-heal";
        var healed = false;

        function booted() {
          var app = document.getElementById("app");
          return !document.getElementById("loader") || (app && !app.hidden);
        }

        function reload() {
          var url = location.pathname + "?fresh=" + Date.now() + location.hash;
          location.replace(url);
        }

        function heal(reason) {
          if (healed || booted()) return;
          healed = true;
          try {
            if (sessionStorage.getItem(FLAG)) return; /* уже пробовали — не циклим */
            sessionStorage.setItem(FLAG, reason || "1");
          } catch (e) {
            return;
          }
          var done = false;
          var finish = function () {
            if (done) return;
            done = true;
            reload();
          };
          window.setTimeout(finish, 2500);
          var jobs = [];
          if (window.caches && caches.keys) {
            jobs.push(
              caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
              })
            );
          }
          if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
            jobs.push(
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(regs.map(function (r) { return r.unregister(); }));
              })
            );
          }
          Promise.all(jobs).then(finish, finish);
        }

        window.addEventListener("error", function (event) {
          var src = event && event.filename ? String(event.filename) : "";
          if (event && (event.error instanceof SyntaxError || src.indexOf("app.js") !== -1 || src.indexOf("schedule.js") !== -1)) {
            heal("error");
          }
        });

        window.setTimeout(function () { heal("timeout"); }, 8000);

        window.addEventListener("load", function () {
          window.setTimeout(function () {
            if (booted()) {
              try { sessionStorage.removeItem(FLAG); } catch (e) {}
            }
          }, 1500);
        });
      })();
    </script>
